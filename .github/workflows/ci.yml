name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: conquest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Active les tests d'intégration (API, captures atomiques, Socket.IO) contre un vrai PostGIS + Redis.
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/conquest_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Le package partagé doit être compilé avant lint/typecheck (types résolus via dist).
      - run: pnpm --filter @conquest/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose et deploy.sh
        run: |
          cp .env.example .env
          docker compose config -q
          bash -n deploy.sh
          docker compose -f docker-compose.yml -f docker-compose.nginx.yml config -q
          sudo apt-get install -y -qq nginx
          bash infra/nginx/check.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy.sh
      - name: Build des images
        run: docker compose build server web
