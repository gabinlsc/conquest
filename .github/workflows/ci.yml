name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Le package partagé doit être compilé avant lint/typecheck (types résolus via dist).
      - run: pnpm --filter @conquest/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose et deploy.sh
        run: |
          cp .env.example .env
          docker compose config -q
          bash -n deploy.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy.sh
      - name: Build des images
        run: docker compose build server web
